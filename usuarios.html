<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários – SGB Biblioteca</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body id="pagina-usuarios">
  <header class="cabecalho">
    <div class="cabecalho__conteudo">
      <a class="logo" href="index.html">SGB – Biblioteca</a>
      <nav aria-label="Menu principal">
        <ul class="menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="livros.html">Livros</a></li>
          <li><a href="usuarios.html" aria-current="page">Usuários</a></li>
          <li><a href="emprestimo.html">Empréstimo</a></li>
          <li><a href="devolucao.html">Devolução</a></li>
          <li><a href="atrasos.html">Atrasos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    <h1>Usuários</h1>
    <p class="subtitulo">Buscar, listar e cadastrar usuários</p>
    <div class="duas-colunas">
      <section aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Usuários cadastrados</h2>
        <form id="formBusca" class="busca" role="search">
          <label for="busca" class="visualmente-oculto">Buscar usuário</label>
          <input type="search" id="busca" name="busca" placeholder="Buscar por nome ou CPF...">
          <button type="submit" class="botao">Buscar</button>
        </form>
        <div class="tabela-container">
        <table id="tabelaUsuarios" class="tabela">
          <thead><tr><th>Nome</th><th>CPF</th><th>E-mail</th></tr></thead>
          <tbody id="corpoUsuarios"></tbody>
        </table>
        </div>
        <p id="contador" class="aviso" aria-live="polite"></p>
      </section>

      <section class="painel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Cadastrar usuário</h2>
        <form id="formUsuario" novalidate>
          <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" placeholder="nome completo" required>
            <span class="erro" id="erro-nome"></span>
          </div>
          <div class="campo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
            <span class="erro" id="erro-cpf"></span>
          </div>
          <div class="campo">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" placeholder="nome@email.com" required>
            <span class="erro" id="erro-email"></span>
          </div>
          <div id="mensagem" class="mensagem" role="alert" hidden></div>
          <div class="acoes">
            <button type="submit" class="botao">Salvar</button>
            <button type="reset" class="botao botao--secundario">Limpar</button>
          </div>
          <p class="nota">* campos obrigatórios</p>
        </form>
      </section>
    </div>
  </main>

  <footer class="rodape">
    <p>SGB – Projeto Integrador · Desenvolvimento de Software</p>
  </footer>

  <script src="js/armazenamento.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
