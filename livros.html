<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros – SGB Biblioteca</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body id="pagina-livros">
  <header class="cabecalho">
    <div class="cabecalho__conteudo">
      <a class="logo" href="index.html">SGB – Biblioteca</a>
      <nav aria-label="Menu principal">
        <ul class="menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="livros.html" aria-current="page">Livros</a></li>
          <li><a href="usuarios.html">Usuários</a></li>
          <li><a href="emprestimo.html">Empréstimo</a></li>
          <li><a href="devolucao.html">Devolução</a></li>
          <li><a href="atrasos.html">Atrasos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    <h1>Livros</h1>
    <p class="subtitulo">Buscar, listar e cadastrar livros</p>
    <div class="duas-colunas">
      <section aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Acervo</h2>
        <form id="formBusca" class="busca" role="search">
          <label for="busca" class="visualmente-oculto">Buscar livro</label>
          <input type="search" id="busca" name="busca" placeholder="Buscar por título, autor ou ISBN...">
          <button type="submit" class="botao">Buscar</button>
        </form>
        <div class="tabela-container">
        <table id="tabelaLivros" class="tabela">
          <thead><tr><th>Título</th><th>Autor</th><th>ISBN</th><th>Exemplares</th></tr></thead>
          <tbody id="corpoLivros"></tbody>
        </table>
        </div>
        <p id="contador" class="aviso" aria-live="polite"></p>
      </section>

      <section class="painel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Cadastrar livro</h2>
        <form id="formLivro" novalidate>
          <div class="campo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" name="titulo" placeholder="ex.: Dom Casmurro" required>
            <span class="erro" id="erro-titulo"></span>
          </div>
          <div class="campo">
            <label for="autor">Autor *</label>
            <input type="text" id="autor" name="autor" placeholder="ex.: Machado de Assis" required>
            <span class="erro" id="erro-autor"></span>
          </div>
          <div class="campo">
            <label for="isbn">ISBN *</label>
            <input type="text" id="isbn" name="isbn" inputmode="numeric" placeholder="somente números" required>
            <span class="erro" id="erro-isbn"></span>
          </div>
          <div class="campo">
            <label for="exemplares">Exemplares *</label>
            <input type="number" id="exemplares" name="exemplares" min="0" step="1" placeholder="número inteiro ≥ 0" required>
            <span class="erro" id="erro-exemplares"></span>
          </div>
          <div id="mensagem" class="mensagem" role="alert" hidden></div>
          <div class="acoes">
            <button type="submit" class="botao">Salvar</button>
            <button type="reset" class="botao botao--secundario">Limpar</button>
          </div>
          <p class="nota">* campos obrigatórios</p>
        </form>
      </section>
    </div>
  </main>

  <footer class="rodape">
    <p>SGB – Projeto Integrador · Desenvolvimento de Software</p>
  </footer>

  <script src="js/armazenamento.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/livros.js"></script>
</body>
</html>
